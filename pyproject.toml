[project]
name = "backup"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "quart",
    "hypercorn",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
